<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸艺 · Paper — Simin You</title>
    <meta name="description" content="从一张纸开始。探索 Just Fold Paper 的交互式折纸教程，以及 SnipFold 的纸花与立体纸艺打印模板。">
    <link rel="canonical" href="https://simin.you/paper/">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #f8f9fa;
            color: #333;
            line-height: 1.7;
            min-height: 100vh;
        }
        main { max-width: 800px; margin: 0 auto; padding: 60px 20px; }
        a { color: #0066cc; }
        a:focus-visible { outline: 2px solid #0066cc; outline-offset: 4px; }
        .back { display: inline-block; margin-bottom: 40px; text-decoration: none; }
        header { margin-bottom: 40px; }
        .eyebrow { color: #555; font-size: 0.9rem; letter-spacing: 0.12em; margin-bottom: 8px; }
        h1 { color: #2c3e50; font-size: 2.5rem; font-weight: 400; margin-bottom: 12px; }
        .intro { color: #555; font-size: 1.1rem; }
        .projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; list-style: none; }
        .projects li { min-width: 0; }
        .project {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 28px;
            background: #fff;
            border: 1px solid #e0e4e8;
            border-radius: 12px;
            color: #2c3e50;
            text-decoration: none;
        }
        .project:hover { border-color: #7f8c8d; }
        h2 { font-size: 1.4rem; font-weight: 500; margin-bottom: 12px; }
        .description { color: #555; margin-bottom: 24px; }
        .action { color: #0066cc; margin-top: auto; }
        @media (max-width: 540px) {
            main { padding: 32px 20px; }
            h1 { font-size: 2rem; }
            .projects { grid-template-columns: 1fr; }
            .project { padding: 22px; }
        }
    </style>
</head>
<body>
    <main>
        <a class="back" href="/">← Simin You</a>
        <header>
            <p class="eyebrow">PAPER</p>
            <h1>纸艺</h1>
            <p class="intro">从一张纸开始。折一折、剪一剪，把平面变成立体。</p>
        </header>
        <ul class="projects" aria-label="纸艺项目">
            <li>
                <a class="project" href="https://justfoldpaper.com/">
                    <h2>Just Fold Paper</h2>
                    <p class="description">交互式折纸与纸飞机教程。逐步跟折、旋转查看每一层，配合可打印图解，按自己的节奏完成作品。</p>
                    <span class="action">开始折纸 ↗</span>
                </a>
            </li>
            <li>
                <a class="project" href="https://snipfold.com/">
                    <h2>SnipFold</h2>
                    <p class="description">纸花与立体纸艺模板。下载并打印模板，结合 3D 组装指引，裁剪、折叠和粘贴出自己的纸艺作品。</p>
                    <span class="action">探索纸艺模板 ↗</span>
                </a>
            </li>
        </ul>
    </main>
</body>
</html>
